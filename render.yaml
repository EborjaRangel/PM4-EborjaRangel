# Blueprint Render: API con Docker (recomendado; menos fallos que build Node en monorepo).
# Dashboard → New → Blueprint → conecta repo y usa este archivo.
#
# Variables obligatorias al crear / en Environment:
#   DATABASE_URL  → Postgres en la nube
#   JWT_SECRET    → cadena larga aleatoria
#
# Front en Vercel: PULSE_BACKEND_URL = URL HTTPS de este servicio (sin barra final).

services:
  - type: web
    name: pm4-pulse-api
    runtime: docker
    plan: free
    dockerfilePath: ./back/Dockerfile
    dockerContext: ./back
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
